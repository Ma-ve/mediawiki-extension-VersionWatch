name: Release

# Publishes a release when a pull request from the Prepare release workflow is merged.
on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version extension.json)
          # The checkout has no tags, so ask the remote.
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "::error::Version $version has already been released"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "VersionWatch $VERSION"
          git push origin "v$VERSION"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=zip --prefix=VersionWatch/ -o "VersionWatch-$VERSION.zip" "v$VERSION"
          mkdir dist
          unzip -q "VersionWatch-$VERSION.zip" -d dist

      - uses: actions/upload-artifact@v4
        with:
          name: VersionWatch-${{ steps.version.outputs.version }}
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "VersionWatch-$VERSION.zip" \
            --title "$VERSION" \
            --generate-notes

      - name: Delete the release branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push origin --delete "$BRANCH" || true
